<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Studio | Dashboard CamerArt</title>
    <link rel="stylesheet" href="css/artist.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">CAMER<span>ART</span></div>
                <p class="role-badge">Artist Pro</p>
            </div>
            <nav class="sidebar-menu">
                <a href="#" class="active" data-section="overview"><i class="fa-solid fa-chart-line"></i> Vue d'ensemble</a>
                <a href="#" data-section="portfolio"><i class="fa-solid fa-palette"></i> Mon Portfolio</a>
                <a href="#" data-section="orders"><i class="fa-solid fa-truck-ramp-box"></i> Commandes</a>
                <a href="#" data-section="branding"><i class="fa-solid fa-bullhorn"></i> Mon Branding</a>
                <a href="#" data-section="wallet"><i class="fa-solid fa-wallet"></i> Portefeuille</a>
            </nav>
            <div class="sidebar-footer">
                <a href="index.html"><i class="fa-solid fa-house"></i> Retour au site</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <h2>Bienvenue, <span id="artist-name">Awa Ndongo</span></h2>
                <div class="top-bar-actions">
                    <button class="btn-upload" onclick="openUploadModal()"><i class="fa-solid fa-plus"></i> Publier une œuvre</button>
                    <img src="https://i.pravatar.cc/150?u=awa" alt="Profile" class="avatar-sm">
                </div>
            </header>

            <section class="stats-grid">
                <div class="stat-card">
                    <i class="fa-solid fa-euro-sign"></i>
                    <div><h3>1,250,000</h3><p>Ventes totales (FCFA)</p></div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-eye"></i>
                    <div><h3>4.2k</h3><p>Vues du profil</p></div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-users"></i>
                    <div><h3>850</h3><p>Followers</p></div>
                </div>
            </section>

            <div id="dynamic-area">
                <section class="content-section">
                    <div class="section-header">
                        <h3>Mes Œuvres Récentes</h3>
                    </div>
                    <div class="portfolio-grid" id="artist-works">
                        </div>
                </section>
            </div>
        </main>
    </div>

    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeUploadModal()">&times;</span>
            <h3>Publier une nouvelle œuvre</h3>
            <form class="upload-form">
                <div class="drop-zone" id="dropZone">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <p>Glissez votre image ici (Haute Qualité)</p>
                    <input type="file" id="fileInput" hidden>
                </div>
                <input type="text" placeholder="Titre de l'œuvre">
                <textarea placeholder="Histoire derrière cette œuvre..."></textarea>
                <div class="input-row">
                    <input type="number" placeholder="Prix (FCFA)">
                    <select>
                        <option>Sculpture</option>
                        <option>Peinture</option>
                        <option>Digital</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Mettre en vente</button>
            </form>
        </div>
    </div>

    <script src="js/artist.js"></script>
</body>
</html>
